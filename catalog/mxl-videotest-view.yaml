key: mxl-videotest-view
display_name: "MXL Test-Pattern Viewer"
summary: |
  Media eXchange Layer consumer for the cross-host fabrics demo: the receiver
  target exposes the received flow and preview from the paired source over
  libfabric tcp. This is the view / receiver half of the split demo.

# umbrella #201 WP2 (association decision, issue #201 comment): this entry
# deploys a topology instance defined by the named topology_params contract
# (catalog/topology-params.schema.yaml, WP1) — a filename in this same
# catalog dir. dmf-cms's launch seam (WP3a) resolves+validates it and
# injects the object into the AWX launch extra_vars; the dmf-runbooks
# playbook (WP3) projects viewer.source_selection to this chart's
# coordinator active-source + the viewer's own flow.id.
topology_ref: topology-params.j1.yaml

ebu:
  layer: 5
  media_function_type: view
  lifecycle_owner: configure

mxl_flows:
  produces: []
  consumes:
    - "5fbec3b1-1b0f-417d-9059-8b94a47197ed"

provision:
  namespace: mxl
  image:
    repository: ghcr.io/dmfdeploy/mxl-fabrics-demo
    tag: v1.0.3
    digest: "sha256:84980dc0c3e1de0a8f3ce12ce4d5149229c73a44b140c15ed77b8e84fb2108b1"
  chart:
    name: mxl-fabrics-demo
    version: 0.4.0
    source: oci://registry.dmf.example.com/charts/mxl-fabrics-demo
  resources:
    # L3 demand profile (umbrella dmfdeploy/dmfdeploy#202 WP0, recalibrated
    # from measured usage in umbrella dmfdeploy/dmfdeploy#258, chart 0.3.1):
    # sum of the rendered <role>-role pod's container requests. MUST equal
    # the chart render — bin/check-catalog-demand.py gates equality in CI.
    # Chart values.yaml's own resources block has the full measured
    # rationale (unconsumed-vs-consumed CPU doubling, per-container
    # measured table, domain-fill note). Role REQUEST totals are unchanged
    # across #258 round 2 (codex GATE:FAIL fix — per-container limits
    # only); the per-container split below shifted from round 1 — status
    # in particular is now the biggest single share (it runs a continuous
    # GStreamer/JPEG preview pipeline, not a poller — codex P2).
    requests:
      cpu: 225m      # videotest-view (view): 160(status)+45(target)+15(targetInfoPublisher)+5(info)
      memory: 128Mi  # 56(status)+56(target)+8(info)+8(targetInfoPublisher)
  # umbrella #201 naming contract (dmf-runbooks
  # roles/l3_run_guard/filter_plugins/l3_topology.py's
  # l3_topology_release_group, WP3 fix-round D5): a topology launch is
  # N+1 releases — the viewer's own service (unchanged) plus one per
  # topology_params.sources[] item, named "{{ l3_release }}-{{ source.id }}".
  # For J1 (catalog/topology-params.j1.yaml, sources source-a/source-b)
  # this is exactly the two entries below. The source-* records are NOT
  # standing services like the viewer's own: they are created by the
  # viewer JT's own release-group loop only while a topology launch is
  # live, and removed by its teardown/rollback.
  netbox_service:
    - name: mxl-videotest-view
      protocol: tcp
      ports: [1234]
      parent_object: server
      tags: ["dmf-catalog", "app:mxl-videotest-view", "exposure:private", "lifecycle:bootstrapped"]
    - name: mxl-videotest-view-source-a
      protocol: tcp
      ports: [1234]
      parent_object: server
      tags: ["dmf-catalog", "app:mxl-videotest-view-source-a", "exposure:private", "lifecycle:bootstrapped"]
    - name: mxl-videotest-view-source-b
      protocol: tcp
      ports: [1234]
      parent_object: server
      tags: ["dmf-catalog", "app:mxl-videotest-view-source-b", "exposure:private", "lifecycle:bootstrapped"]

configure:
  playbook: playbooks/launch-mxl-fabrics-demo.yml
  awx_project: dmf-runbooks
  awx_job_template: media-launch-mxl-videotest-view
  on_success_tag: "lifecycle:active"
  health_probe:
    kind: log
    container: target
    expect_pattern: "Target info"

finalise:
  playbook: playbooks/teardown-mxl-fabrics-demo.yml
  awx_project: dmf-runbooks
  awx_job_template: media-finalise-mxl-videotest-view
  on_success_tag: "lifecycle:bootstrapped"

# Placement note: role=view, selector dmf.io/mxl-demo-role=view.
# The chart's node selector/tolerations should keep this on the MXL view node.

dependencies: []
