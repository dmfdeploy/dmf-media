# J1 two-source topology instance — umbrella dmfdeploy/dmfdeploy#201 WP1.
#
# A concrete `topology_params` object satisfying
# catalog/topology-params.schema.yaml (schema_version 1): J1's build target
# per spec §4 — 2 × mxl-videotestsrc (distinct flow ids and test patterns,
# so the switch is visually unambiguous) + 1 × mxl-videotest-view, on the
# standing single-node lane. Doc/schema only (WP1) — WP2/WP3/WP3a wire the
# actual chart parameterisation, playbook projection, and console launch
# seam this instance is the frozen input for.

topology_params:
  schema_version: 1

  # Shared per-source demand profile (umbrella dmfdeploy/dmfdeploy#347) —
  # applies IDENTICALLY to every sources[] release (N copies, not N distinct
  # profiles: §3.3's no-per-source-catalog-entries rule extends to demand,
  # not just identity). Carries forward the exact numbers previously
  # authored standalone in the now-deleted catalog/mxl-videotestsrc.yaml,
  # recalibrated from measured usage in umbrella dmfdeploy/dmfdeploy#258
  # (chart 0.3.1) — this is a relocation of that contract onto the topology
  # object, not a new measurement. bin/check-catalog-demand.py validates
  # this against one rendered role=source release-group and reports the
  # full J1 aggregate (2 x this + the viewer's own provision.resources).
  source_profile:
    resources:
      requests:
        cpu: 450m      # videotestsrc (source): 370(writer)+55(initiator)+10(reader)+5(info)+10(status)
        memory: 160Mi  # 96(writer)+24(initiator)+8(reader)+8(info)+24(status)

  # ILLUSTRATIVE — never a literal env slug in git. Per this schema's
  # target_facility.resolution: the console launch seam (WP3a) resolves the
  # current env's NetBox site slug at launch time and injects the real
  # value; the launcher (WP3) validates it against that env's own site.
  # This placeholder exists only so the instance is a complete, well-formed
  # example of the shape WP3/WP3a project against.
  target_facility: dmf-example-site

  sources:
    # Source 1: keeps the flow id shared by both catalog entries in the
    # shipped F1/F2 baseline (catalog/mxl-videotestsrc.yaml,
    # catalog/mxl-videotest-view.yaml `mxl_flows`) — continuity with today,
    # no artificial churn of an id nothing else forced to change.
    - id: source-a
      flow_id: "5fbec3b1-1b0f-417d-9059-8b94a47197ed"
      # Standard GStreamer videotestsrc named pattern (mxl-gst-testsrc is a
      # GStreamer component) — no pattern enum exists yet anywhere in this
      # repo (WP2 introduces per-source patterns for the first time); smpte
      # (colour bars) and checkers-8 (the second source's pattern, below) are
      # maximally visually distinct, satisfying §4's "visually unambiguous"
      # requirement.
      pattern: smpte
    # Source 2: fresh flow id — J1 doubles the source count from today's
    # single shared UUID baseline.
    #
    # Pattern must be AFFORDABLE at this flow's format on the target node —
    # the test is whether the writer holds the grain rate, not whether the
    # pattern is static (umbrella #335; the chart's own `pattern` comment in
    # charts/mxl-fabrics-demo/values.yaml carries the full static/non-static
    # taxonomy and its source citation).
    #
    # This was `ball` until 2026-08-01. Measured on the CAX21-class demo node
    # at 1920x1080 v210 @30000/1001, request 370m:
    #   ball        1.55 cores  -> 29.513 fps against a 29.970 target; the flow
    #                              fell behind real time WITHOUT BOUND — 122s of
    #                              accumulated lag, growing 4.5s per 5 minutes
    #   smpte       0.41-0.45   -> 29.971 fps, latency flat (source-a, above)
    #   checkers-8  0.11        -> 29.969 fps, latency flat (this source, after)
    # A source that cannot meet its grain deadline is not a usable live source:
    # with clockoverlay in the pipeline, switching to it shows a visibly stale
    # clock, so the switch "works" and still looks broken.
    #
    # checkers-8 was chosen because it is affordable with the widest margin —
    # it is one of the static/cached patterns, so it is cheaper even than
    # smpte — while staying visually unambiguous against smpte (§4) and being
    # present in mxl-gst-testsrc's pattern_map (enum 10; an absent name throws
    # out of pattern_map.at() and takes the writer down).
    - id: source-b
      flow_id: "b0ae9cba-a989-4568-ac96-8bd19272c966"
      pattern: checkers-8

  viewer:
    id: viewer-a
    # Initial launch selection — source-a is active at launch. The switch
    # (WP4/WP5, §5-6) re-sets this same field at reconfigure time; it is
    # not re-authored per layer, it rides unchanged from the catalog value.
    source_selection: source-a
