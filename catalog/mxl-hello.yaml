key: mxl-hello
display_name: "MXL Hello — Video Demo"
summary: |
  Media eXchange Layer single-node demo: gst-testsrc writer, fake-reader,
  and mxl-info sidecar sharing an in-memory domain. Validates the MXL
  runtime on a k3s node before Hetzner rollout.

# EBU placement (must match ADR-0003 vocabulary)
ebu:
  layer: 4
  vertical: media-processing
  lifecycle_owner: configure

# MXL flow metadata
mxl_flows:
  produces:
    - "5fbec3b1-1b0f-417d-9059-8b94a47197ed"
  consumes: []

# Artifacts the Provision stage ensures are present
provision:
  namespace: mxl
  image:
    repository: ghcr.io/dmfdeploy/mxl-fabrics-demo
    tag: v1.0.3
    digest: "sha256:84980dc0c3e1de0a8f3ce12ce4d5149229c73a44b140c15ed77b8e84fb2108b1"
  chart:
    name: mxl-hello
    version: 0.1.0
    source: oci://registry.dmf.example.com/charts/mxl-hello
  netbox_service:
    name: mxl-hello
    protocol: tcp
    ports: []
    parent_object: server
    tags: ["dmf-catalog", "app:mxl-hello", "exposure:private", "lifecycle:bootstrapped"]

# Artifacts the Configure stage applies on launch
configure:
  playbook: playbooks/launch-mxl-hello.yml
  awx_project: dmf-runbooks
  awx_job_template: media-launch-mxl-hello
  on_success_tag: "lifecycle:active"
  health_probe:
    kind: log
    container: info
    expect_pattern: "Active"

# Artifacts the Finalise stage applies on teardown
finalise:
  playbook: playbooks/teardown-mxl-hello.yml
  awx_project: dmf-runbooks
  awx_job_template: media-finalise-mxl-hello
  on_success_tag: "lifecycle:bootstrapped"

# Processor-node placement (ADR-0017 §5)
# Local/dev: empty nodeSelector/tolerations (runs on any single node).
# Hetzner production: the chart values override must set:
#   placement:
#     nodeSelector:
#       dmf.io/role: mxl-processor
#     tolerations:
#       - key: "dmf.io/mxl"
#         operator: "Equal"
#         value: "true"
#         effect: "NoSchedule"
# This ensures MXL workloads are scheduled only on nodes with the MXL
# processing capability and are tolerated against the taint applied per
# ADR-0017 §5 to keep general workloads off MXL nodes.

# Soft dependencies — informational for v1, enforced in v2
dependencies: []
