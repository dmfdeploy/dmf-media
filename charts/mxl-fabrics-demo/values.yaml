namespace: mxl
createNamespace: false

# Role for this release:
#   source -> initiator + writer deployment
#   view   -> target deployment
role: source

# One consolidated image carries every demo media function (mxl-fabrics-demo,
# mxl-gst-testsrc, mxl-gst-sink, mxl-info, fake-reader.sh) — chart containers just
# pick the binary. v1.0.2 added GStreamer + the gst tools; v1.0.3 adds python3, the
# status sidecar (mxl-status-server.py), and the env-configurable mxl-gst-sink.
image:
  # In-cluster Zot (catalog-chart pattern, ADR-0025): 630 seeds the image from
  # GHCR; containerd resolves the service-DNS host via the 300-k3s hosts.toml.
  # Override registry back to ghcr.io/dmfdeploy for out-of-cluster dev pulls.
  registry: zot.zot.svc.cluster.local:5000
  repository: dmf/mxl-fabrics-demo
  tag: v1.0.3
  pullPolicy: IfNotPresent

# Placement mode for the source/view pair (dmfdeploy/dmfdeploy#17):
#   split-node  — today's cross-host shape: hostNetwork + per-role
#                 dmf.io/mxl-demo-role node pinning (one role per node).
#   single-node — colocated demo on one node: pod network (no hostNetwork,
#                 no status-port collision) and no per-role selector; both
#                 releases schedule by placement.nodeSelector alone.
placementMode: split-node

# The status sidecar's node-reader ClusterRole/ClusterRoleBinding are
# cluster-scoped: a namespaced catalog launcher cannot create them. Platform
# bootstrap (dmf-infra awx-integration) pre-creates an equivalent and launches
# with create=false; standalone helm installs keep the default.
nodeAccess:
  create: true

# Toggle the demo media functions on each side (all run from the single image above).
demoFunctions:
  writer: true        # mxl-gst-testsrc test-pattern producer (initiator/producer side)
  localReader: true   # fake-reader.sh on the producer side
  info: true          # mxl-info poller on both sides (prints Format/Head/Active)
  status: true        # MXL status sidecar (JSON flow stats + JPEG preview) for the dmf-cms "MXL Flows" page

# Demo status sidecar — consumed by dmf-cms over the node tailnet IP (hostNetwork).
# `provider` is the cloud slug used purely for the UI logo; NO IPs are exposed.
status:
  port: 9000
  provider: aliyun
  # umbrella #308: mxl-gst-sink busy-wait/log-flood pacing knobs. Plumbed ONLY
  # into the view-side status container's env (charts/mxl-fabrics-demo/templates/
  # target.yaml, PREVIEW=1) — that is the only status container that ever spawns
  # mxl-gst-sink (mxl-status-server.py only starts its preview child when
  # PREVIEW=1); the source-side status container (initiator.yaml, PREVIEW=0)
  # never runs mxl-gst-sink at all, so these would be inert there.
  preview:
    tooEarlyRetryNs: ""    # empty -> the binary's own default (one grain period for the flow rate)
    logRateLimitSeconds: 10
    logLevel: INFO

fabrics:
  provider: tcp                       # first cross-host test; verbs/efa later
  service: 1234                       # tcp port; opened node-to-node by the Aliyun VSwitch SG rule
  interface: eth0                     # Override locally with lima0; Aliyun uses the VPC private NIC (<aliyun-vpc-cidr>) on eth0.

domainPath: /home/mxl/domain      # matches the demo images' workingDir (mxl user $HOME)
domainSizeLimit: 256Mi

# Flow shared by target (-f json) and initiator (-f id). Same 1080p29 test flow
# shape; flow.id is now a per-release value (umbrella #201 WP2, spec §3/§4) —
# each Helm release (one per topology_params.sources[] entry, plus the
# viewer's own release) sets its own flow.id via --set, replacing F1's single
# fixed UUID shared by both catalog entries. flow.json's own "id" field is a
# LITERAL Helm template expression (rendered via the `tpl` function in
# configmap.yaml, not plain string interpolation) so it always tracks
# flow.id — a stale/mismatched embedded id would desync the descriptor
# published to /home/mxl/config/flow.json from the actual flow.id every
# other consumer (initiator, reader, info, status) uses.
flow:
  id: "5fbec3b1-1b0f-417d-9059-8b94a47197ed"
  json: |
    {
      "$license": "SPDX-License-Identifier: Apache-2.0",
      "description": "MXL Fabrics Test Flow, 1080p29",
      "id": "{{ .Values.flow.id }}",
      "tags": {
        "urn:x-nmos:tag:grouphint/v1.0": [
          "Media Function XYZ:Video"
        ]
      },
      "format": "urn:x-nmos:format:video",
      "label": "MXL Fabrics Test Flow, 1080p29",
      "parents": [],
      "media_type": "video/v210",
      "grain_rate": { "numerator": 30000, "denominator": 1001 },
      "frame_width": 1920,
      "frame_height": 1080,
      "interlace_mode": "progressive",
      "colorspace": "BT709",
      "components": [
        { "name": "Y",  "width": 1920, "height": 1080, "bit_depth": 10 },
        { "name": "Cb", "width": 960,  "height": 1080, "bit_depth": 10 },
        { "name": "Cr", "width": 960,  "height": 1080, "bit_depth": 10 }
      ]
    }

# Test pattern for the source-role writer (mxl-gst-testsrc, a GStreamer
# element wrapper — umbrella #201 WP2, spec §4: "distinct test pattern, so
# the switch is visually unambiguous"). Standard GStreamer videotestsrc
# named patterns (e.g. smpte, checkers-8); J1's two catalog sources use smpte
# and checkers-8 respectively (dmf-media catalog/topology-params.j1.yaml).
# Meaningless for role=view releases — only threaded to the writer container
# below.
# VERIFIED 2026-08-01 against the real binary in the deployed image
# (umbrella #335; this comment previously carried an unverified ASSUMPTION):
# `mxl-gst-testsrc --help` reports "-p, --pattern TEXT [smpte]", and the
# writer logs confirm the name is mapped to the GStreamer enum by the tool's
# own pattern_map (smpte -> pattern=0, checkers-8 -> 10, ball -> 18) in
# tools/mxl-gst/testsrc.cpp of the pinned MXL checkout. Two consequences worth
# keeping: an unknown name hits pattern_map.at() and THROWS, so a typo takes
# the writer down rather than falling back to a default; and the value must be
# AFFORDABLE at the flow's format on the target node — see below.
#
# The rule is affordability, NOT staticness. videotestsrc splits patterns in
# gst_video_test_src_is_static_pattern() (gst-plugins-base 1.26.2-1+deb13u1,
# the Debian trixie package this image installs — see docker/mxl-fabrics/
# Dockerfile):
#   static      — rendered ONCE and served from the cached buffer; cheapest.
#                 checkers-1/2/4/8, solid colours. (Static only while
#                 horizontal-speed is unset; mxl-gst-testsrc never sets it —
#                 testsrc.cpp:345-353 at the pinned SHA builds the pipeline
#                 without that property.)
#   non-static  — re-rendered EVERY frame: SMPTE, SNOW, BLINK, BALL.
# Non-static does not mean unusable. Measured at 1080p v210 @30000/1001 on the
# CAX21-class demo node (umbrella #335):
#   checkers-8  ~0.11 cores  static, cached          — ships as source-b
#   smpte       ~0.41-0.45   NON-static, affordable  — ships as source-a
#   ball        ~1.55        NON-static, ~3.4x smpte — could not hold real
#                            time: 29.513 fps against a 29.970 target, lag
#                            growing without bound. This was the #335 defect.
# So our own default (smpte) is a non-static pattern we run happily because it
# fits; ball is excluded because it does not. snow and blink are also
# non-static and UNMEASURED — measure before shipping either.
# Acceptance test for any new pattern: the writer must hold the flow's grain
# rate with latency flat (not merely "look fine") — a source that misses its
# deadline drifts silently behind real time.
pattern: smpte

# This release's own source identity slug (umbrella #201 WP2, spec §4.1) —
# the source-supervisor compares this against the coordinator's
# active-source field (data.active-source, keyed by sources[].id) to decide
# whether THIS release's initiator should run. Matches
# topology_params.sources[].id for this release; meaningless for role=view.
# Empty default is deliberately fail-closed: an unset sourceId can never
# equal a real active-source value, so a misconfigured source release parks
# forever rather than ever transmitting.
sourceId: ""

# MXL-processor placement + the network-unavailable
# toleration the cross-cloud media nodes carry (Hetzner CCM route controller).
placement:
  nodeSelector:
    dmf.io/role: mxl-processor
  tolerations:
    - { key: dmf.io/mxl, operator: Equal, value: "true", effect: NoSchedule }
    - { key: node.kubernetes.io/network-unavailable, operator: Exists, effect: NoSchedule }

# ── Source-side initiator ──────────────────────────────────────────────────────
initiator:
  targetInfo: ""      # opaque libfabric target-info string from the target's stdout

# Per-container resource requests AND limits — umbrella dmfdeploy/dmfdeploy#258
# measured calibration (2026-07-24, chart 0.3.1), replacing the WP0-era
# request-only placeholders above. Consumed by the L3 capacity preflight
# (dmfdeploy/dmfdeploy#202 WP0) to budget CPU/memory across media nodes, and
# by the catalog demand profiles — catalog/mxl-videotest-view.yaml's own
# provision.resources.requests (role=view) plus the topology-owned
# topology_params.source_profile in catalog/topology-params.j1.yaml
# (role=source; the standalone catalog/mxl-videotestsrc.yaml entry this
# figure used to live in was deleted, umbrella dmfdeploy/dmfdeploy#347) —
# bin/check-catalog-demand.py gates both staying in lock-step with this
# chart's rendered REQUESTS (limits are NOT gated — they don't enter the L3
# request budget, so they may be set generously for burst safety without
# moving the fit arithmetic). This
# rationale is why memory limits were sized generously below; CPU limits
# were REMOVED entirely on 2026-07-29 for a different reason (see the "CPU
# LIMITS REMOVED" block further down) — the two are independent decisions.
#
# ROUND 2 (codex GATE:FAIL on the round-1 cut, both findings fixed here):
#   P1 — round 1 set every memory LIMIT to the old WP0-era REQUEST value,
#     reasoning "it ran safely as a floor, so it's safe as a ceiling." A
#     Kubernetes request is a scheduling reservation, not a proof of
#     per-container peak usage — the only evidence round 1 actually had was
#     POD-AGGREGATE memory (80-120Mi source, 88-90Mi view), which says
#     nothing about any ONE container's own ceiling. Fixed by taking fresh
#     PER-CONTAINER `kubectl top --containers` measurements (below) and
#     setting each memory limit from ITS OWN observed value, not a borrowed
#     pod-aggregate or a repurposed old request.
#   P2 — round 1 gave every "tiny sidecar" (reader/info/status/
#     targetInfoPublisher) the same 25m CPU request==limit floor. That was
#     wrong for the VIEW pod's status container specifically: it runs a
#     CONTINUOUS GStreamer/JPEG preview pipeline (PREVIEW=1, 5fps —
#     files/mxl-status-server.py), not a poller — round 1's aggregate view
#     headroom (198m pod max) couldn't prove this one container stayed
#     under 25m, and a real 25m cap risked CFS-throttling the preview.
#     Fixed by giving info/status a genuine PER-ROLE split (see
#     _helpers.tpl's mxl-fabrics-demo.resourcesFor) since usage differs
#     wildly by role (status: ~4m source vs ~157m view) — a single shared
#     value could not describe both honestly.
#
# MEASURED PER-CONTAINER, consumed state, source+view live (2026-07-24,
# `kubectl top --containers`, 3 samples, dead stable — the round-1 numbers
# above were POD aggregates; these are the per-container breakdown that
# was missing):
#   source: writer 810m/80Mi (the data-plane container — it's ALSO the
#     plausible owner of most `medium: Memory` domain-emptyDir fill, since
#     it produces the flow), initiator 50-52m/19Mi, reader 7m/1Mi,
#     info 1m/0Mi, status 4m/17Mi
#   view: status 157m/56Mi (the 5fps JPEG preview pipeline is the view
#     pod's BIGGEST consumer — codex P2), target 35-36m/44Mi, info 1m/0Mi,
#     target-info-publisher 2m/1Mi
#
# Role REQUEST totals are UNCHANGED from round 1 (the L3 fit arithmetic
# must not move): source 450m/160Mi, view 225m/128Mi. Limits are NOT
# total-constrained this round (see above) — each is set from its own
# container's measured value + margin, so role limit totals now differ
# from round 1's forced-equal-to-contract shape; that's expected, not a bug.
#
# Domain-fill accounting: the `domain` emptyDir (see domainSizeLimit above,
# 256Mi) is `medium: Memory` — its fill charges against container memory.
# The pod-aggregate measurements are `kubectl top` working-set numbers,
# which already include it; the fresh per-container measurements above are
# the SAME tool, same accounting. writer's 384Mi limit is sized to cover
# its own 80Mi measured working set PLUS worst-case domain fill (256Mi) —
# 80+256=336Mi, +margin — since writer is the container most plausibly
# holding those pages (it's the flow producer). No separate pod-level
# domain add-on is needed anywhere else; do not double-count it.
#
# Per-container split (CPU requests sum to EXACTLY 450m/225m; memory limits
#   are per-container-measurement-derived, not total-constrained — see
#   below. The CPU limits recorded next are HISTORY, not current state —
#   they were REMOVED 2026-07-29 per umbrella #301, see the "CPU LIMITS
#   REMOVED" block further down; only memory limits remain on any
#   container today):
#   source requests: writer 370 (sustained-unconsumed ≈ pod 428m minus
#     measured sidecar sum ≈ 364m, +margin), initiator 55, reader 10,
#     info(source) 5, status(source) 10 = 450
#   view requests: status(view) 160 (the real per-role cost — this is the
#     container codex flagged), target 45, target-info-publisher 15,
#     info(view) 5 = 225
#   CPU limits (HISTORICAL, round-2 calibration — REMOVED 2026-07-29, see
#     below): writer had 950m (measured 810 consumed +margin); initiator
#     had 100m; status(view) had 250m (measured 157 sustained, headroom for
#     scene complexity); target had 100m; true-idle sidecars (reader,
#     info(source), info(view), status(source), targetInfoPublisher) had
#     50m — genuine burst room at the time (not request==limit), cheap
#     insurance per codex, even though none of them was remotely close to
#     it.
#   Memory requests (role totals still 160Mi/128Mi, redistributed per the
#     measured values): source — writer 96, initiator 24, reader 8,
#     info(source) 8, status(source) 24 = 160; view — target 56,
#     status(view) 56, info(view) 8, target-info-publisher 8 = 128.
#   Memory limits (per-container, NOT total-constrained, CURRENT — unlike
#     the CPU limits above, these were not removed): writer 384Mi (see
#     domain-fill note above); status(view) 128Mi (GStreamer pipeline,
#     measured 56Mi — >2x margin for scene-dependent variance); target
#     128Mi (measured 44Mi); everything else = max(2x its own measured
#     working set, 32Mi floor) — initiator 40Mi (2x19), reader 32Mi (floor,
#     2x1=2), info(source)/info(view) 32Mi each (floor, 2x0=0),
#     status(source) 40Mi (2x17=34, rounded up), targetInfoPublisher 32Mi
#     (floor, 2x1=2).
#
# info/status are genuinely PER-ROLE now (mxl-fabrics-demo.resourcesFor in
# _helpers.tpl resolves resources.<name>.<role>, falling back to a flat
# resources.<name> for any container name that's never role-split) — the
# source/view sub-keys below are NOT independently tunable duplicates of
# the same cost, they are two DIFFERENT measured costs for two different
# runtime behaviors (PREVIEW=0 poller vs PREVIEW=1 continuous encoder).
# CPU LIMITS REMOVED FROM EVERY MEDIA-PATH CONTAINER BELOW (2026-07-29, live
# env v5on-r8aw, umbrella #301). Live evidence: the `status` view container
# was CFS-throttled pinned at its (then) 250m limit — 10.00 throttle
# periods/s — while `writer` was pinned at 949.7m against its 950m limit,
# ALSO 10.00 periods/s, on a node sitting at only 68% CPU. Both are
# constant-rate media processes, not bursty services (writer measured
# p50 408m / p95 409m / max 411m across 412 samples — dead flat), so
# CFS-quota throttling on a frame-cadence pipeline is a MISSED-DEADLINE
# condition, not an efficiency saving: the view pod's status container was
# SIGKILLed (exit 137) with its GStreamer preview log showing "Failed to get
# grain ... TOO EARLY / TOO LATE" and monotonically climbing "Video latency
# increase detected", and the console showed no preview video at all.
# Raising the limits live fixed the preview immediately, and counter-
# intuitively DROPPED total node CPU from 2049m to 1622m — a throttled
# real-time pipeline burns extra CPU on retries, PTS re-adjustment and
# dropped-grain handling, so unclamping it does the real work for LESS.
# Residual sub-period-burst throttling still persisted even at the raised
# limits (view status 1.16/s, readers ~1.1/s), which is why the decision is
# to remove the CPU limits rather than raise them again.
#
# requests are now the ONLY contention protection for these containers, and
# they currently UNDERSTATE measured consumption (e.g. writer requests 370m
# while measuring 414-624m) — that gap is umbrella dmfdeploy/dmfdeploy#302's
# call, not this change's; no requests value below is touched here.
#
# limits.memory is untouched (byte-for-byte) — memory is not compressible:
# dropping a memory limit turns a leak into a node-down event instead of one
# dead container (umbrella #258 NetBox OOM lesson). This change is CPU-limits-
# only.
resources:
  writer:
    requests:
      cpu: 370m
      memory: 96Mi
    limits:
      # cpu limit removed 2026-07-29 (umbrella #301): observed pinned at
      # 949.7m against its 950m limit, 10.00 throttle periods/s, while
      # measuring a dead-flat p50 408m / p95 409m / max 411m — see the
      # resources-block-level comment above for the full rationale.
      memory: 384Mi
  initiator:
    requests:
      cpu: 55m
      memory: 24Mi
    limits:
      # cpu limit removed 2026-07-29 (umbrella #301) — constant-rate media
      # process; see the resources-block-level comment above.
      memory: 40Mi
  reader:
    requests:
      cpu: 10m
      memory: 8Mi
    limits:
      # cpu limit removed 2026-07-29 (umbrella #301) — constant-rate media
      # process; see the resources-block-level comment above.
      memory: 32Mi
  info:
    source:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        # cpu limit removed 2026-07-29 (umbrella #301) — constant-rate media
        # process; see the resources-block-level comment above.
        memory: 32Mi
    view:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        # cpu limit removed 2026-07-29 (umbrella #301) — constant-rate media
        # process; see the resources-block-level comment above.
        memory: 32Mi
  status:
    source:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        # cpu limit removed 2026-07-29 (umbrella #301) — constant-rate media
        # process; see the resources-block-level comment above.
        memory: 40Mi
    view:
      requests:
        cpu: 160m
        memory: 56Mi
      limits:
        # cpu limit removed 2026-07-29 (umbrella #301): this is the
        # container that surfaced the whole problem — the 5fps GStreamer/JPEG
        # preview encoder was observed pinned at its 250m limit wanting 333m,
        # SIGKILLed (exit 137) with a real-time pipeline losing the deadline
        # race ("Failed to get grain ... TOO EARLY / TOO LATE", monotonically
        # climbing "Video latency increase detected"); see the
        # resources-block-level comment above for the full rationale.
        memory: 128Mi
  target:
    requests:
      cpu: 45m
      memory: 56Mi
    limits:
      # cpu limit removed 2026-07-29 (umbrella #301) — constant-rate media
      # process; see the resources-block-level comment above.
      memory: 128Mi
  targetInfoPublisher:
    requests:
      cpu: 15m
      memory: 8Mi
    limits:
      # cpu limit removed 2026-07-29 (umbrella #301) — constant-rate media
      # process; see the resources-block-level comment above.
      memory: 32Mi
