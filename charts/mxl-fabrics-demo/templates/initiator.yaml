{{- if eq .Values.role "source" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mxl-fabrics-demo.name" . }}-initiator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mxl-fabrics-demo.labels" . | nindent 4 }}
    dmf.component: mxl-fabrics-initiator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "mxl-fabrics-demo.name" . }}-initiator
  template:
    metadata:
      annotations:
        checksum/source-handshake: {{ include (print $.Template.BasePath "/source-handshake.yaml") . | sha256sum }}
        checksum/status-sidecar: {{ include (print $.Template.BasePath "/status-sidecar.yaml") . | sha256sum }}
      labels:
        {{- include "mxl-fabrics-demo.labels" . | nindent 8 }}
        app: {{ include "mxl-fabrics-demo.name" . }}-initiator
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        dmf.io/mxl-demo-role: {{ .Values.role }}
        {{- toYaml .Values.placement.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.placement.tolerations | nindent 8 }}
      containers:
        {{- if .Values.demoFunctions.writer }}
        # Producer: mxl-gst-testsrc generates a test-pattern video flow ({{ .Values.flow.id }})
        # into the shared domain — this is the source of grains the fabric forwards.
        - name: writer
          image: {{ include "mxl-fabrics-demo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["mxl-gst-testsrc", "-d", {{ .Values.domainPath | quote }}, "-v", "config/flow.json"]
          volumeMounts:
            - { name: domain, mountPath: {{ .Values.domainPath }} }
            - { name: flow-config, mountPath: /home/mxl/config }
          workingDir: /home/mxl
        {{- end }}
        # Sender: waits for the producer to create the flow, then reads it and
        # transfers grains over the fabric to the target (the receiver).
        - name: initiator
          image: {{ include "mxl-fabrics-demo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/source-supervisor.sh"]
          volumeMounts:
            - { name: domain, mountPath: {{ .Values.domainPath }} }
            - { name: shared, mountPath: /shared }
            - { name: source-handshake-scripts, mountPath: /scripts }
            - { name: coordinator, mountPath: /coordinator, readOnly: true }
          workingDir: /home/mxl
        {{- if .Values.demoFunctions.localReader }}
        # Local consumer (sanity): reads the producer's flow on this node.
        - name: reader
          image: {{ include "mxl-fabrics-demo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["/usr/local/bin/fake-reader.sh", "--domain", {{ .Values.domainPath | quote }}, "--video-flow-id", {{ .Values.flow.id | quote }}, "-i", "2s"]
          volumeMounts:
            - { name: domain, mountPath: {{ .Values.domainPath }} }
          workingDir: /home/mxl
        {{- end }}
        {{- if .Values.demoFunctions.info }}
        # Observer: polls the producer flow's state on this node.
        - name: info
          image: {{ include "mxl-fabrics-demo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/dumb-init", "--"]
          args:
            - /bin/bash
            - -c
            - |
              trap 'exit 0' SIGINT SIGTERM
              while true; do
                mxl-info mxl://{{ .Values.domainPath }}?id={{ .Values.flow.id }} || true
                echo ----------
                sleep 5
              done
          volumeMounts:
            - { name: domain, mountPath: {{ .Values.domainPath }} }
          workingDir: /home/mxl
        {{- end }}
        {{- if .Values.demoFunctions.status }}
        # Status sidecar (source side) — JSON flow stats on :{{ .Values.status.port }}.
        # PREVIEW=0: the preview image comes from the receiver (proves cross-host arrival).
        - name: status
          image: {{ include "mxl-fabrics-demo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/dumb-init", "--", "python3", "/usr/local/bin/mxl-status-server.py"]
          env:
            - { name: MXL_DOMAIN, value: {{ .Values.domainPath | quote }} }
            - { name: MXL_FLOW_ID, value: {{ .Values.flow.id | quote }} }
            - name: MXL_NODE
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - { name: MXL_PROVIDER, value: {{ .Values.status.provider | quote }} }
            - { name: MXL_ROLE, value: "source" }
            - { name: MXL_FABRICS_INTERFACE, value: {{ .Values.fabrics.interface | quote }} }
            - { name: MXL_TRANSPORT_PROVIDER, value: {{ .Values.fabrics.provider | quote }} }
            - { name: MXL_SERVICE, value: {{ .Values.fabrics.service | quote }} }
            - { name: STATUS_PORT, value: {{ .Values.status.port | quote }} }
            - { name: PREVIEW, value: "0" }
          volumeMounts:
            - { name: domain, mountPath: {{ .Values.domainPath }} }
            - { name: host-os-release, mountPath: /host/etc, readOnly: true }
            - { name: host-os-release-lib, mountPath: /host/usr/lib/os-release, readOnly: true }
            - { name: status-sidecar-scripts, mountPath: /usr/local/bin/mxl-status-server.py, subPath: mxl-status-server.py }
          workingDir: /home/mxl
        {{- end }}
      volumes:
        - name: domain
          emptyDir: { medium: Memory, sizeLimit: {{ .Values.domainSizeLimit }} }
        - name: shared
          emptyDir: {}
        - name: host-os-release
          hostPath:
            path: /etc
            type: Directory
        - name: host-os-release-lib
          hostPath:
            path: /usr/lib/os-release
            type: File
        - name: status-sidecar-scripts
          configMap:
            name: {{ include "mxl-fabrics-demo.name" . }}-status-sidecar
            defaultMode: 0555
        - name: source-handshake-scripts
          configMap:
            name: {{ include "mxl-fabrics-demo.name" . }}-source-handshake
            defaultMode: 0555
        - name: coordinator
          configMap:
            name: mxl-coordinator
            optional: true
        {{- if .Values.demoFunctions.writer }}
        - name: flow-config
          configMap:
            name: {{ include "mxl-fabrics-demo.name" . }}-flow
        {{- end }}
{{- end }}
