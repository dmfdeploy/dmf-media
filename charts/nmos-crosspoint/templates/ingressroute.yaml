{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nmos-crosspoint
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nmos-crosspoint.nmosLabels" . | nindent 4 }}
  annotations:
    # Private (Tailscale) lane. The ingressclass annotation — not just the
    # entrypoint — is what binds this to the private Traefik (codex P2.6).
    dmf.exposure: private
    traefik.ingress.kubernetes.io/router.ingressclass: {{ .Values.ingress.ingressClass | quote }}
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint }}
  tls: {}
  routes:
    - match: "Host(`{{ .Values.ingress.host }}`)"
      kind: Rule
      services:
        - name: nmos-crosspoint
          port: {{ .Values.service.port }}
{{- end }}
