apiVersion: v1
kind: Service
metadata:
  name: nmos-crosspoint
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nmos-crosspoint.nmosLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: nmos-crosspoint
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
      name: http
