apiVersion: v1
kind: ConfigMap
metadata:
  name: nmos-crosspoint-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nmos-crosspoint.nmosLabels" . | nindent 4 }}
data:
  # The server reads ./config/settings.json and exits if it is missing. `ip`
  # under staticNmosRegistries is a bare hostname (no scheme or port). Only
  # keys the pinned controller reads are set; the rest keep its defaults.
  settings.json: |
    {
      "staticNmosRegistries": [
        {
          "ip": {{ .Values.registry.ip | quote }},
          "port": {{ .Values.registry.port }},
          "priority": {{ .Values.registry.priority }},
          "domain": {{ .Values.registry.domain | quote }}
        }
      ],
      "logFiles": "./log/",
      "logOutput": false,
      "server": { "port": {{ .Values.containerPort }}, "address": "0.0.0.0" },
      "nmos": {
        "registryVersions": {{ .Values.nmos.registryVersions | toJson }},
        "connectVersions": {{ .Values.nmos.connectVersions | toJson }}
      },
      "mdns": { "listen": "0.0.0.0" },
      "disabledModules": { "core": ["topology"] },
      "reconnectOnSdpChanges": false,
      "fixSdpBugs": false,
      "firstDynamicNumber": 1000
    }
