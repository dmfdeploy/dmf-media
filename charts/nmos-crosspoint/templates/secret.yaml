apiVersion: v1
kind: Secret
metadata:
  name: nmos-crosspoint-auth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nmos-crosspoint.nmosLabels" . | nindent 4 }}
type: Opaque
stringData:
  # users.json. The upstream example grants `__noAuth` global+public WRITE — we
  # TIGHTEN it (codex P3.10): writes (incl. IS-05 connection PATCH) require the
  # `admin` group; only reads stay open on the private lane. Admin password
  # SHA256 is injected by the launcher role from OpenBao at deploy time.
  users.json: |
    {
      "users": {
        "admin": { "password": {{ .Values.auth.adminPasswordSha256 | quote }}, "groups": ["user", "admin"] }
      },
      "permissions": {
        "global": {
          "allowRead": { "users": ["__noAuth"], "groups": ["user"] },
          "allowWrite": { "users": [], "groups": ["admin"] },
          "denyRead": { "users": [], "groups": [] },
          "denyWrite": { "users": [], "groups": [] }
        },
        "public": {
          "allowRead": { "users": ["__noAuth"], "groups": ["user"] },
          "allowWrite": { "users": [], "groups": ["admin"] },
          "denyRead": { "users": [], "groups": [] },
          "denyWrite": { "users": [], "groups": [] }
        }
      }
    }
