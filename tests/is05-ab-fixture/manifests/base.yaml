# IS-05 A/B MXL fixture (dmfdeploy/dmfdeploy#624): registry and two sources.
# The driver (run.py) creates the namespace and the ConfigMaps from files in
# this directory's parent, then applies this file and viewer.yaml.
#
# Images are pinned by digest only:
#   MXL demo image   ghcr.io/dmfdeploy/mxl-fabrics-demo (tag v1.0.3)
#   nmos-cpp         docker.io/rhastie/nmos-cpp (tag master-b6c8367, nmos-cpp
#                    master b6c8367, which contains the MXL PRs #483, #503, #521)
#
# All three media pods share one MXL domain: a tmpfs on the single node at
# /var/lib/dmf-mxl/is05-ab, owned by uid 1000 (run.sh mounts it).
apiVersion: v1
kind: Pod
metadata:
  name: nmos-registry
  namespace: is05-ab
  labels: {app.kubernetes.io/name: nmos-registry, app.kubernetes.io/part-of: is05-ab-fixture}
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: registry
      image: docker.io/rhastie/nmos-cpp@sha256:68e61e17dffab70303cfc10fcf4f5f8f219ae84eb189961e120e86a126959413
      command: [bash, -c]
      args:
        - jq --arg ip "$POD_IP" '.host_address=$ip' /config/registry.json > /tmp/registry.json
          && exec /home/nmos-cpp-registry /tmp/registry.json
      env:
        - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
      ports: [{containerPort: 8010, name: http}]
      readinessProbe: {tcpSocket: {port: 8010}, periodSeconds: 2}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
        - {name: tmp, mountPath: /tmp}
  volumes:
    - {name: config, configMap: {name: nmos-config}}
    - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: nmos-registry
  namespace: is05-ab
spec:
  selector: {app.kubernetes.io/name: nmos-registry}
  # 8011: the Query API WebSocket. The registry's subscription ws_href names
  # the address the client used with this port; the crosspoint slice needs it.
  ports:
    - {name: http, port: 8010, targetPort: 8010}
    - {name: query-ws, port: 8011, targetPort: 8011}
---
apiVersion: v1
kind: Pod
metadata:
  name: source-a
  namespace: is05-ab
  labels: {app.kubernetes.io/name: source-a, app.kubernetes.io/part-of: is05-ab-fixture}
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: testsrc
      image: ghcr.io/dmfdeploy/mxl-fabrics-demo@sha256:3fb75956ea776e17a16eeaf56b7983df3524cb8c465c367d53589be548000970
      command: [mxl-gst-testsrc, -d, /home/mxl/domain, -v, /flows/flow-a.json, -p, smpte, -t, A]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: domain, mountPath: /home/mxl/domain}
        - {name: flows, mountPath: /flows, readOnly: true}
  volumes:
    - {name: domain, hostPath: {path: /var/lib/dmf-mxl/is05-ab, type: Directory}}
    - {name: flows, configMap: {name: mxl-flows}}
---
apiVersion: v1
kind: Pod
metadata:
  name: source-b
  namespace: is05-ab
  labels: {app.kubernetes.io/name: source-b, app.kubernetes.io/part-of: is05-ab-fixture}
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: testsrc
      image: ghcr.io/dmfdeploy/mxl-fabrics-demo@sha256:3fb75956ea776e17a16eeaf56b7983df3524cb8c465c367d53589be548000970
      command: [mxl-gst-testsrc, -d, /home/mxl/domain, -v, /flows/flow-b.json, -p, checkers-8, -t, B]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: domain, mountPath: /home/mxl/domain}
        - {name: flows, mountPath: /flows, readOnly: true}
  volumes:
    - {name: domain, hostPath: {path: /var/lib/dmf-mxl/is05-ab, type: Directory}}
    - {name: flows, configMap: {name: mxl-flows}}
