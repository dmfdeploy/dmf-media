name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install ansible tooling
        run: |
          python3 -m pip install --user -r requirements-ci.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          # Dependabot does not track this input; bump it by hand.
          version: v3.18.4
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint . -p
      - name: ansible syntax-check
        run: |
          shopt -s nullglob
          playbooks=(playbooks/*.yml)
          [ ${#playbooks[@]} -gt 0 ] || { echo "No playbooks found"; exit 1; }
          for pb in "${playbooks[@]}"; do
            echo "=== syntax-check: $pb ==="
            ansible-playbook "$pb" --syntax-check
          done
      - name: helm-lint charts/
        run: |
          set -eu
          shopt -s nullglob
          chart_dirs=()
          while IFS= read -r -d '' chart_yaml; do
            chart_dirs+=("$(dirname "$chart_yaml")")
          done < <(find charts -name 'Chart.yaml' -print0 2>/dev/null)
          if [ ${#chart_dirs[@]} -eq 0 ]; then
            echo "No charts found"
            exit 1
          fi
          for chart_dir in "${chart_dirs[@]}"; do
            echo "=== helm-lint: $chart_dir ==="
            helm lint "$chart_dir"
          done
      - name: catalog demand equality (L3 WP0)
        run: |
          # Dependabot does not track this inline pin; bump it by hand.
          python3 -m pip install --user pyyaml==6.0.4
          python3 bin/check-catalog-demand.py

  conformance:
    # Media Function package conformance (umbrella issue dmfdeploy/dmfdeploy#634).
    # No path filter on purpose: a workflow- or job-level filter would leave the
    # check unreported on a diff that touches no package, and a required check
    # would then wait forever. The job is cheap, so it always runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          # Dependabot does not track this input; bump it by hand.
          version: v3.18.4
      - name: Install conformance tool dependencies
        run: python3 -m pip install --user pyyaml==6.0.4 jsonschema==4.26.0
      - name: Every test file and harness script is run
        # A test nobody runs gives false confidence. Each test_*.py file must
        # contribute tests to the unittest run below, which a pytest-style file
        # does not. Each harness script must be on a command line of this
        # workflow, not in a comment or step name.
        run: |
          set -eu
          python3 - <<'PY'
          import pathlib, sys, unittest
          suite = unittest.defaultTestLoader.discover("tests/conformance")
          def cases(s):
              for t in s:
                  yield from cases(t) if isinstance(t, unittest.TestSuite) else [t]
          # Compare full paths: two files can share a name in different directories.
          collected = {}
          for t in cases(suite):
              f = getattr(sys.modules.get(type(t).__module__), "__file__", None)
              if f:
                  path = pathlib.Path(f).resolve()
                  collected[path] = collected.get(path, 0) + 1
          files = sorted(p.resolve() for p in pathlib.Path("tests").rglob("test_*.py"))
          print("test files:", len(files), "tests collected:", sum(collected.values()))
          if not files:
              sys.exit("No test files found")
          bad = [str(f.relative_to(pathlib.Path.cwd())) for f in files if not collected.get(f)]
          if bad:
              sys.exit("No test collected from: " + ", ".join(bad))
          PY
          active=$(sed -e 's/[[:space:]]#.*$//' -e '/^[[:space:]]*#/d' \
            -e '/^[[:space:]]*-\{0,1\}[[:space:]]*name:/d' .github/workflows/ci.yml)
          missing=""
          for f in tests/harness/*.sh; do
            printf '%s\n' "$active" | grep -qF -- "$f" || missing="$missing$f"$'\n'
          done
          [ -z "$missing" ] || { printf 'No command runs:\n%s' "$missing"; exit 1; }
      - name: Conformance tool tests (good and bad fixtures)
        run: python3 -m unittest discover -s tests/conformance -v
      - name: Chart values schema and helm lint --strict (charts with a values schema)
        run: |
          set -eu
          checked=0
          for chart in charts/*/; do
            if [ -f "${chart}values.schema.json" ]; then
              echo "=== chart-only: $chart ==="
              python3 bin/dmf-function-conform --chart-only "$chart"
              checked=$((checked + 1))
            fi
          done
          [ "$checked" -gt 0 ] || { echo "No chart has a values schema"; exit 1; }
      - name: No package goes unchecked
        # There is no packages/ directory, so there is no package conformance
        # step. Add one when the first package lands; this fails until then.
        run: |
          [ -z "$(ls -A packages 2>/dev/null)" ] ||
            { echo "packages/ has content but no step checks it"; exit 1; }

  harness:
    # The render matrix and the supervisor acceptance demo assert on their own
    # output. The demo runs the rendered supervisor in a container, so it needs
    # Docker, which the runner has.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          # Dependabot does not track this input; bump it by hand.
          version: v3.18.4
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml==6.0.4
      - name: Render matrix
        run: tests/harness/render-matrix.sh
      - name: Supervisor acceptance demo
        run: tests/harness/run-demo.sh

  review-comments:
    # Comments state why, not which review prompted them
    # (dmfdeploy/dmfdeploy#768). Allowlist: .review-comment-allow.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: No review history in comments
        run: bin/check-review-comments.sh
      - name: Allowlist parser self-test
        run: bin/check-review-comments.sh --self-test

  working-model:
    # Working-model block sync (umbrella issue dmfdeploy/dmfdeploy#32): the
    # agent-context block in CLAUDE.md/AGENTS.md/QWEN.md must stay byte-identical
    # to the umbrella template; --strict fails on a missing or drifted block.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Umbrella: canonical template + checker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dmfdeploy/dmfdeploy
          ref: working-model-v2
          path: .umbrella
          persist-credentials: false
      - name: Working-model block sync (strict)
        run: .umbrella/bin/check-working-model-sync.sh --repo . --strict --template .umbrella/docs/templates/working-model-block.md
