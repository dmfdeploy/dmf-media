name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Install ansible tooling
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user ansible ansible-lint yamllint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814  # v4.2.0
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint . -p
      - name: ansible syntax-check
        run: |
          shopt -s nullglob
          for pb in playbooks/*.yml; do
            echo "=== syntax-check: $pb ==="
            ansible-playbook "$pb" --syntax-check
          done
      - name: helm-lint charts/
        run: |
          set -eu
          shopt -s nullglob
          chart_dirs=()
          while IFS= read -r -d '' chart_yaml; do
            chart_dirs+=("$(dirname "$chart_yaml")")
          done < <(find charts -name 'Chart.yaml' -print0 2>/dev/null)
          if [ ${#chart_dirs[@]} -eq 0 ]; then
            echo "SKIP: no charts found"
            exit 0
          fi
          for chart_dir in "${chart_dirs[@]}"; do
            echo "=== helm-lint: $chart_dir ==="
            helm lint "$chart_dir"
          done
      - name: catalog demand equality (L3 WP0)
        run: |
          python3 -m pip install --user pyyaml
          python3 bin/check-catalog-demand.py

  conformance:
    # Media Function package conformance (umbrella issue dmfdeploy/dmfdeploy#634).
    # No path filter on purpose: a workflow- or job-level filter would leave the
    # check unreported on a diff that touches no package, and a required check
    # would then wait forever. The job is cheap, so it always runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814  # v4.2.0
      - name: Install conformance tool dependencies
        run: python3 -m pip install --user pyyaml==6.0.3 jsonschema==4.26.0
      - name: Conformance tool tests (good and bad fixtures)
        run: python3 -m unittest discover -s tests/conformance -v
      - name: Chart values schema and helm lint --strict (charts with a values schema)
        run: |
          set -eu
          for chart in charts/*/; do
            if [ -f "${chart}values.schema.json" ]; then
              echo "=== chart-only: $chart ==="
              python3 bin/dmf-function-conform --chart-only "$chart"
            fi
          done
      - name: Conformance of every package
        run: |
          set -eu
          if [ -d packages ] && [ -n "$(ls -A packages)" ]; then
            python3 bin/dmf-function-conform packages/*/
          else
            echo "SKIP: no packages yet"
          fi

  review-comments:
    # Comments state why, not which review prompted them
    # (dmfdeploy/dmfdeploy#768). Allowlist: .review-comment-allow.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: No review history in comments
        run: bin/check-review-comments.sh

  working-model:
    # Working-model block sync (umbrella issue dmfdeploy/dmfdeploy#32): the
    # agent-context block in CLAUDE.md/AGENTS.md/QWEN.md must stay byte-identical
    # to the umbrella template; --strict fails on a missing or drifted block.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 — umbrella: canonical template + checker
        with:
          repository: dmfdeploy/dmfdeploy
          ref: working-model-v2
          path: .umbrella
          persist-credentials: false
      - name: Working-model block sync (strict)
        run: .umbrella/bin/check-working-model-sync.sh --repo . --strict --template .umbrella/docs/templates/working-model-block.md
