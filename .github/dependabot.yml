---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "no-issue"
    commit-message:
      prefix: "ci(deps)"
    # Major upgrades are done on purpose, as their own changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    # CI runs Python 3.12 and ansible 15 needs 3.13 or newer. Remove this
    # ignore when CI moves to Python 3.13.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ansible"
        versions: [">= 15"]
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "no-issue"
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "pip"
    directory: "/tests/is05-ab-fixture"
    schedule:
      interval: "monthly"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "no-issue"
    commit-message:
      prefix: "build(deps)"
    # Major upgrades are done on purpose, as their own changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/docker/mxl-fabrics"
    schedule:
      interval: "monthly"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "no-issue"
    commit-message:
      prefix: "build(deps)"
    # Major upgrades are done on purpose, as their own changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
